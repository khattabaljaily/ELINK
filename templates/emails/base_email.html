{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block subject %}E LINK{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f8f8; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f8f8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 12px 28px -8px rgba(6,40,61,0.16);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#041c2c 0%,#0f4c5c 100%); padding:32px 40px; text-align:center;">
              <img src="cid:{{ logo_cid }}" width="52" height="52" alt="E LINK" style="display:block; margin:0 auto 12px; border-radius:50%; background:#ffffff;">
              <span style="font-family:'Plus Jakarta Sans',Arial,sans-serif; font-weight:800; font-size:20px; color:#ffffff; letter-spacing:0.02em;">E LINK</span>
            </td>
          </tr>

          <!-- Status ribbon -->
          {% block ribbon %}{% endblock %}

          <!-- Content -->
          <tr>
            <td style="padding:36px 40px; color:#15262b; font-size:15px; line-height:1.65;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px; background-color:#f5f8f8; text-align:center; font-size:12px; color:#62787a; border-top:1px solid #e7edec;">
              <p style="margin:0 0 6px;">E LINK &middot; Qatar</p>
              <p style="margin:0;">Questions? Contact <a href="mailto:support@elinkonline.com" style="color:#0fb07e; text-decoration:none;">support@elinkonline.com</a></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
