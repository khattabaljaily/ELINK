{% extends "base.html" %}

{% block title %}Check your email · E LINK{% endblock %}

{% block content %}
  <div class="auth-card">
    <h1 class="section-title" style="font-size:1.4rem">Check your email</h1>
    <p class="helptext">If an account exists for that email, we've sent a link to reset your password. It may take a few minutes to arrive.</p>
    <p class="auth-card__footer"><a href="{% url 'accounts:login' %}">&larr; Back to log in</a></p>
  </div>
{% endblock %}
