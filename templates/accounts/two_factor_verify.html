{% extends "base.html" %}

{% block title %}Verification code · E LINK{% endblock %}

{% block content %}
  <div class="auth-card">
    <h1 class="section-title" style="font-size:1.4rem">Enter your verification code</h1>
    <p class="helptext" style="margin-bottom:16px">Open your authenticator app and enter the 6-digit code for E LINK.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label for="code">Verification code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Verify</button>
    </form>
    <p class="auth-card__footer"><a href="{% url 'accounts:login' %}">&larr; Back to log in</a></p>
  </div>
{% endblock %}
